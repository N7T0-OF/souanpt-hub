name: Deploy hub and protected analytics to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error title=Cloudflare deployment blocked::CLOUDFLARE_API_TOKEN is missing. No deployment was performed. Configure a narrowly scoped token, then rerun this workflow."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require exclusive Cloudflare production deployment
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://api.cloudflare.com/client/v4/accounts/3812fed3ef304d1dea00c6498d09aa52/pages/projects/souanpthub';
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.CF_TOKEN}` }, signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Cloudflare Pages project lookup failed (${response.status})`);
          const data = await response.json();
          const project = data.result;
          if (!data.success || project?.name !== 'souanpthub' || project?.subdomain !== 'souanptjub.pages.dev') {
            throw new Error('Cloudflare Pages project identity could not be verified');
          }
          if (project.source?.type !== 'github' || project.source.config?.production_branch !== 'main'
            || project.source.config.production_deployments_enabled !== false) {
            throw new Error('Disable automatic production branch deployments in Cloudflare Pages Build > Branch control before direct deployment');
          }
          console.log('Cloudflare production Git builds are disabled; direct deployment may proceed.');
          NODE
      - name: Prepare allowlisted Cloudflare site
        id: package
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          out="$RUNNER_TEMP/souanpt-cloudflare-${GITHUB_SHA}"
          node scripts/prepare-deploy.mjs --channel=cloudflare --output="$out"
          echo "directory=$out" >> "$GITHUB_OUTPUT"
      - name: Deploy protected Analytics Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3812fed3ef304d1dea00c6498d09aa52
          command: deploy --config cloudflare/wrangler.analytics.toml
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3812fed3ef304d1dea00c6498d09aa52
          command: pages deploy ${{ steps.package.outputs.directory }} --project-name=souanpthub --branch=main --commit-hash=${{ github.sha }}
      - name: Verify production commit marker
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: https://souanptjub.pages.dev
        run: |
          actual="$(curl --fail --silent --show-error "$SITE_URL/build-info.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).commit))')"
          test "$actual" = "$EXPECTED_SHA" || { echo "Expected $EXPECTED_SHA, got $actual"; exit 1; }
